services:
  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: capitalism_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d capitalism_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/capitalism_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password123
    depends_on:
      postgres-db:
        condition: service_healthy

  ai-engine:
    build:
      context: ./ai-engine
    ports:
      - "8000:8000"
    environment:
      BACKEND_URL: http://backend:8080
      OLLAMA_BASE_URL: http://ollama:11434/v1
    depends_on:
      - backend
      - ollama

volumes:
  postgres-data:
  ollama-data:
